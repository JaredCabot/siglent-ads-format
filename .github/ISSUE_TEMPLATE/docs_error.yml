name: Error in the documentation
description: Something in the documents is wrong, unclear or missing
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the correction. Errors found against real hardware or the original documents are the most valuable reports this project gets.

        Check ERRATA.md first; the problem may already be listed there.
  - type: dropdown
    id: document
    attributes:
      label: Which document?
      options:
        - "SDG2000X .ADS Format Specification (PDF)"
        - "SPD3000X .ADS format notes"
        - "ERRATA.md"
        - "README.md"
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Page, section or address
      placeholder: "Section 3.2, page 9, the file header table"
    validations:
      required: true
  - type: textarea
    id: says
    attributes:
      label: What it says now
      description: Copy the line, or describe the table or figure.
    validations:
      required: true
  - type: textarea
    id: should
    attributes:
      label: What it should say
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: How do you know?
      description: Say which firmware file shows it (model, version and file size), and how you checked.
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Photos, captures or anything else that helps.
    validations:
      required: false
